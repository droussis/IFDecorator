  alphabets:
    latin_base: "abcdefghijklmnopqrstuvwxyz"
    greek: "αβγδεζηθικλμνξοπρστυφχψω"
    cyrillic_ru: "абвгдеёжзийклмнопрстуфхцчшщъыьэюя"
    cyrillic_uk: "абвгґдеєжзиіїйклмнопрстуфхцчшщьюя"
    cyrillic_bg: "абвгдежзийклмнопрстуфхцчшщъьюя"
  alphabet_note: >
    Cyrillic alphabet ORDER is language-specific (uk adds g-with-upturn, ye, i, yi;
    bg drops yo, yery, e). keywords:no_adjacent_consecutive needs the per-language
    list, not a shared Cyrillic range. Greek final sigma is positional - exclude it
    from the ordering.

# ===========================================================================
# PER-INSTRUCTION MATRIX - all 54 IFEval-G ids
# ===========================================================================
instructions:

  # ---- carries over unchanged (structural / markdown / exact-string) ----
  "detectable_format:number_bullet_lists": {status: ok}
  "detectable_format:number_highlighted_sections": {status: ok}
  "detectable_format:json_format": {status: ok}
  "detectable_format:title": {status: ok}
  "detectable_format:square_brackets": {status: ok}
  "detectable_content:number_placeholders": {status: ok}
  "combination:two_responses": {status: ok}
  "combination:repeat_prompt": {status: ok, depends: [G1, G8]}
  "copy:copy": {status: ok, depends: [G1, G8]}
  "copy:copying_simple": {status: ok, depends: [G1, G8]}
  "copy:copying_multiple": {status: ok, depends: [G1, G8]}
  "copy:repeat_phrase": {status: ok, depends: [G1]}
  "new:copy_span_idx": {status: ok, depends: [G1, G8]}
  "paragraphs:paragraphs": {status: ok}
  "paragraphs:paragraphs2": {status: ok}
  "length_constraints:number_paragraphs": {status: ok}
  "punctuation:no_comma":
    status: ok
    note: >
      "," is the comma in every in-scope L/C/G language. This is the id that was
      vacuous for CJK and Arabic; inside this script set it is genuinely fine.
  "punctuation:punctuation_dot": {status: ok}
  "punctuation:punctuation_exclamation": {status: ok}
  "detectable_format:bigram_wrapping": {status: ok, depends: [G1]}
  "keywords:palindrome":
    status: ok
    depends: [G1]
    note: >
      Pick and document one policy - are diacritics folded before reversal?
      Recommended: no folding (NFC, exact). Low-value id; consider dropping.

  # ---- localize: semantics fine, literal comes from language_profiles ----
  "startend:quotation":
    status: localize
    fix: "Accept the language's quote_pair in addition to ASCII double quote."
    why: >
      DE low-9/high-6, FR guillemets, PL/CS/HU/RO low-9/high-9, RU/UK/EL guillemets,
      DA reversed guillemets. A correct answer in the target language currently fails
      a constraint it actually satisfied.
  "detectable_content:postscript":
    status: localize
    fix: "postscript_marker kwarg from the profile - already a kwarg, no code change."
  "detectable_format:multiple_sections":
    status: localize
    fix: "section_spliter kwarg from the profile - already a kwarg, no code change."
  "startend:end_checker":
    status: localize
    fix: "end_phrase must be authored in the target language."
    why: >
      _ENDING_OPTIONS is English ("Any other questions?"). Forcing an English closing
      phrase onto a Greek answer directly contradicts a response_language constraint.

  # ---- patch: needs the global fixes ----
  "length_constraints:number_words": {status: patch, depends: [G1, G4]}
  "length_constraints:number_sentences": {status: patch, depends: [G1, G3]}
  "length_constraints:nth_paragraph_first_word": {status: patch, depends: [G1, G8]}
  "detectable_format:sentence_hyphens": {status: patch, depends: [G1, G3]}
  "first_word:first_word_sent": {status: patch, depends: [G1, G3, G8]}
  "first_word:first_word_answer": {status: patch, depends: [G1, G8]}
  "last_word:last_word_sent": {status: patch, depends: [G1, G3, G8]}
  "last_word:last_word_answer": {status: patch, depends: [G1, G8]}
  "count:count_unique": {status: patch, depends: [G1, G4]}
  "count:counting_composition": {status: patch, depends: [G1, G3, G4]}
  "count:lowercase_counting": {status: patch, depends: [G1, G2]}
  "letters:letter_counting": {status: patch, depends: [G1, G2]}
  "letters:letter_counting2": {status: patch, depends: [G1, G2]}
  "keywords:letter_frequency":
    status: patch
    depends: [G1, G2]
    note: "Sample the letter from language_profiles.alphabets, never from a-z."
  "change_case:capital_word_frequency":
    status: patch
    depends: [G1, G4]
    note: "isupper() is already Unicode-correct (verified on ru, el); only tokenization needs G4."
  "keywords:no_adjacent_consecutive":
    status: patch
    depends: [G1, G8]
    note: "Needs the per-language alphabet ordering."
  "keywords:existence": {status: ok, depends: [G1], note: "surface-form matching, see G7 residual_risk_accepted"}
  "keywords:frequency": {status: ok, depends: [G1], note: "surface-form matching, see G7 residual_risk_accepted"}
  "keywords:forbidden_words":
    status: ok
    depends: [G1]
    note: >
      Surface-form matching retained by decision. Inflection evasion is MEASURED
      and accepted - see G7 residual_risk_accepted. Treat this id as a weak
      constraint in ru/pl/cs/sk/sl/el/fi/hu/lt/lv/de, and do not stack several of
      them on one prompt expecting a conjunctive difficulty increase.
  "keywords:word_once": {status: ok, depends: [G1], note: "surface-form matching, see G7 residual_risk_accepted"}
  "keywords:word_count_different_numbers": {status: ok, depends: [G1], note: "surface-form matching, see G7 residual_risk_accepted"}
  "keywords:exclude_word_harder": {status: ok, depends: [G1], note: "surface-form matching, see G7 residual_risk_accepted"}
  "keywords:start_end": {status: ok, depends: [G1, G8], note: "surface-form matching, see G7 residual_risk_accepted"}
  "keywords:keyword_specific_position": {status: patch, depends: [G1, G3], note: "surface-form matching, see G7 residual_risk_accepted"}
  "count:count_increment_word": {status: ok, depends: [G1], note: "surface-form matching, see G7 residual_risk_accepted"}

  # ---- redefine: English is baked into the CHECK, not into the concept ----
  "change_case:english_lowercase":
    status: patch
    depends: [G1, G5, G6, G8]
    rename_to: "change_case:all_lowercase"
    fix: 'Drop the `and langdetect.detect(value) == "en"` conjunct; keep islower().'
    why: >
      MEASURED - islower() is already correct for Cyrillic and Greek. Lowercase ru,
      el, pl and de sentences all report islower()=True and all three scripts fail
      the shipped check ONLY because of the hardcoded English gate. Language is
      already enforced by language:response_language; conflating the two makes the
      case constraint unsatisfiable outside English, which yields a constant-zero
      reward and, under IFDecorator's conjunctive reward, zeroes the whole sample.
  "change_case:english_capital":
    status: patch
    depends: [G1, G5, G6, G8]
    rename_to: "change_case:all_capital"
    fix: "Same - drop the English conjunct, keep isupper()."
    note: >
      Greek all-caps orthography drops accents; isupper() accepts both accented and
      unaccented forms, so no action needed - but do NOT add a round-trip
      text == text.upper() check, which would reject correct Greek.
  "language:response_language":
    status: patch
    depends: [G5, G6]
    fix: "Drop-in replacement implemented and validated in lid.py."
    measured: "48/48 true positives, 0/552 false positives, all degenerate inputs rejected."
    note: >
      Replace the shipped LANGUAGE_CODES (30 entries) with
      language_identification.supported (24). Sampling a language outside that set
      injects verifier noise straight into the reward.

  # ---- exclude ----
  "detectable_format:constrained_response":
    status: exclude
    scripts: [latin, cyrillic, greek]
    unless: "you translate _CONSTRAINED_RESPONSE_OPTIONS per language"
    why: >
      The options are module constants, not kwargs - ("My answer is yes.",
      "My answer is no.", "My answer is maybe."). Unlike postscript / section /
      end_checker there is no kwarg to localize through, so it needs a real code
      change. Forcing an English literal also contradicts a response_language
      constraint if both land on the same prompt.

# ===========================================================================
# SYNTHESIS-SIDE NOTES (IFDecorator w4_evol.py)
# ===========================================================================
synthesis:

  eligibility:
    what: >
      w4_evol.py:770 does `hard_keys = [key for key in cons_dict.keys()]` and samples
      uniformly. Replace with a filter over this matrix plus the row's target
      language, so `exclude` ids are never emitted and `localize` ids draw their
      literals from language_profiles.

  conflicts_to_add:
    what: >
      INSTRUCTION_CONFLICTS is English-shaped. These pairs are contradictory only in
      a multilingual setting and must be added.
    pairs:
      - ["language:response_language", "detectable_format:constrained_response"]
      - ["language:response_language", "startend:end_checker"]
      - ["language:response_language", "keywords:letter_frequency"]
      - ["language:response_language", "detectable_content:postscript"]

  length_calibration_bug:
    where: "w4_evol.py:591 and :602"
    what: >
      `len(seed_data["response"]) * random.uniform(0.5, 1.2) // 50 * 50` takes len()
      of a STRING - a character count - and uses it as a WORD threshold. Pre-existing
      English-only bug that makes "at least N words" roughly 4-5x too large.
    multilingual_impact: >
      chars-per-word ranges from ~5.1 (en) to ~8.0 (fi), so the same code yields a
      systematically harder constraint for agglutinative languages. Difficulty would
      then correlate with language rather than with the instruction, which corrupts
      the pass_rate routing in w5.
    fix: >
      Use count_words(response); if a character heuristic is retained, divide by
      language_profiles[lang].chars_per_word.

  keyword_sourcing:
    what: >
      w4_evol.get_keyword() prompts an LLM for keywords and falls back to
      instructions_util.WORD_LIST - an English word list.
    fix: >
      Per-language fallback lists, and require the sampled keyword to be a surface
      form that actually occurs in the seed response, so the G7 stem match has a
      real target.

  difficulty_routing:
    what: >
      pass_rate in w5 is computed with these same checkers, so every defect above
      corrupts the easy/hard routing BEFORE any training happens. An unpatched
      `patch` id pushes prompts into hard_pool for the wrong reason; a vacuous id
      pushes them into easy_pool, where w4 evolves them further and compounds the
      error across all 5 rounds.
    recommendation: "Land the global patches before running the flywheel at all."

# ===========================================================================
# TRIPWIRES - extend probe.jsonl to catch VERIFIER leakage, not just model hacking
# ===========================================================================
tripwires:
  # The two keyword probes are MONITORS, not assertions - G7 was dropped by
  # decision, so these are expected to leak. Track the rate so that if the policy
  # starts exploiting them the trend is visible rather than invisible.
  - id: "keywords:forbidden_words"
    probe: "response uses only inflected forms of the banned lemma"
    expect: "leaks by design - alert on a RISING rate across checkpoints"
    currently: "1.0 in ru / pl / el / de - MEASURED"
  - id: "keywords:existence"
    probe: "keyword appears only inside a longer unrelated word"
    expect: "leaks by design - alert on a RISING rate across checkpoints"
    currently: "1.0 - MEASURED"
  - id: "count:lowercase_counting"
    probe: "Cyrillic or Greek response with many lowercase words, constraint 'at most 0'"
    expect: 0.0
    currently: "1.0 without G2 - MEASURED"
  - id: "language:response_language"
    probe: "empty / emoji-only / punctuation-only / code-only response"
    expect: 0.0
    currently: "1.0 via the fail-open exception path; lid.py returns False on all four - VERIFIED"
  - id: "language:response_language"
    probe: "correct answer in the target language, uppercased"
    expect: 1.0
    currently: "fr fails without the lowercasing step (raw UPPER -> ca @ 0.170) - MEASURED"
  - id: "length_constraints:number_words"
    probe: "identical text submitted NFC and NFD"
    expect: "identical score"
    currently: "differs by up to 2.7x - MEASURED"
